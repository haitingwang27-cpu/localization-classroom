const lessons=[["范围与估算", "先确认字数、重复率、语言和交付物，再估算工期。PM 不必亲自翻译，但必须知道工作量从何而来。", "与客户约定分批交付及估算修订点", "先交核心文本，待分析完成再锁定剩余排期。", [1, 2, 3, 1, 2, -2]], ["供应商与试译", "MTPE 是机器翻译译后编辑，不等于低质量；报价也不能直接代表能力。试译应匹配实际文本。", "安排小规模付费试译，再按文本类型分工", "试译消耗预算和时间，但降低选错供应商的风险。", [-3, 5, 2, 0, 3, -2]], ["术语管理", "术语表记录概念的统一译法；翻译记忆库（TM）记录历史双语句段。两者可能冲突。", "请 Lin 核查术语来源与适用范围", "确认旧译名适用于本作，并把依据写入术语表。", [-1, 4, 2, 1, 3, -2]], ["范围变更", "新增、删除、修改是不同工作量。变更单用于重新确认费用、范围和交期。", "先交旧范围，新增内容另设里程碑", "避免原有任务被打断，但客户需要接受两次交付。", [2, 2, 3, -1, 2, -1]], ["技术 QA", "占位符由游戏运行时替换；变量名称必须符合代码约定。自动检查只能发现部分风险。", "请工程师确认变量规范并批量扫描", "不仅修复当前错误，还发现同类问题。", [-2, 6, 2, 1, 1, -2]], ["采购公平", "试译用于评估能力，不应悄悄成为免费生产内容。付费、长度和使用范围应事先明确。", "用已有作品筛选，仅对入围者做短付费试译", "减少无效测试，但可能错过缺少作品集的新人。", [-2, 2, 3, 0, 3, -1]], ["资源规划", "可用工时不是日历天数。新增人手也有熟悉项目和统一风格的成本。", "与译员协商拆分高低优先级任务", "保留周末休息，把非关键内容安排到下周。", [-1, 2, 3, -1, 5, -1]], ["并行项目", "多项目冲突需要明确优先级和责任人，而不是默认由 PM 无限补位。", "请主管明确两个项目的优先级并拆分责任", "主管同意 UI 项目由同事协助，但你需交接。", [-2, 1, 4, 0, 3, -2]], ["风格指南", "风格不是越华丽越好。角色身份、场景、语体和可读性都应有可执行示例。", "先做三组样例，让客户选定方向", "样例获得反馈，避免整批文本反复重写。", [-1, 5, 3, 2, 1, -2]], ["工作范围", "翻译、审校、配音润稿是不同服务。PO 是采购订单，额外工作应得到明确授权。", "先批准紧急部分，其余等待书面确认", "录音可以启动，未授权工作不再继续扩大。", [-2, 2, 3, 0, 4, -1]], ["版本控制", "文件名和修改时间不足以证明版本正确。交付清单、版本号和变更记录更可靠。", "冻结交付目录，请工程师核对导入记录", "工程师确认实际构建版本，避免猜测。", [-1, 4, 3, 1, 1, -2]], ["风险沟通", "LQA 是在实际游戏中验证语言、显示和功能。削减测试时应明确未覆盖内容。", "提交两套测试方案供制作人签字选择", "制作人选中核心流程优先方案，风险有记录。", [2, 3, 3, 1, 1, -2]], ["配音上下文", "配音需要场景、情绪、关系和时长等信息。缺失视频并不意味着所有台词都不能录。", "先录有明确上下文的台词，未知段落单独排期", "减少棚期浪费，未知段落仍需后续确认。", [-1, 3, 4, 0, 2, -1]], ["录音变更", "现场改词可能影响字幕、口型和时长。导演与语言负责人需要共享最终录音文本。", "让导演提供两版可演绎台词，由语言负责人快速确认", "录音短暂停顿，字幕与演绎保持一致。", [-2, 4, 3, 1, 3, -1]], ["缺陷状态", "Known issue 不代表已修复。严重程度、修复优先级和关闭理由是不同字段。", "请制作人确认延期修复责任人和目标版本", "缺陷保留为已知风险，当前版本仍可能受影响。", [0, 2, 4, 0, 3, -1]], ["缺陷分流", "47 个问题未必同等重要。影响主线、支付、变量和可访问性的错误通常需要优先评估。", "按影响与修复成本分组，交给对应负责人", "并行处理减少 PM 的单点瓶颈。", [-2, 3, 5, 1, 2, -1]], ["角色设定", "英文代词与中文表达不必机械对应。可通过省略代词、称谓和语境保持角色设定。", "先确认角色指代规则，再用检索缩小复查范围", "减少盲目全量改写，仍需人工判断语境。", [-2, 4, 3, 1, 2, -2]], ["成本归属", "额外成本可能来自客户变更、内部估算不足或供应商失误。不能把全部责任归给一方。", "按原因拆分工时，与财务和客户分别确认", "部分费用获批，未确认费用仍由项目暂担。", [2, 1, 3, 0, 3, -2]], ["审校仲裁", "准确性错误与风格偏好需要分开。MQM 等质量框架可帮助团队讨论错误类型。", "抽取争议样例，由客户和语言负责人统一标准", "先对齐标准，再批量处理，仍需部分人工仲裁。", [-1, 4, 3, 1, 3, -2]], ["绩效与管理", "PM 的贡献包括协调、预防风险和帮助他人，而不只是个人完成的字数。", "整理团队贡献和客观项目数据，要求正式沟通", "记录更完整，但无法保证管理层改变决定。", [0, 0, 3, 0, 3, -1]], ["社区反馈", "截图不一定代表最新构建。先核实版本、复现条件和实际影响，再回应。", "请 QA 复现并准备经客户确认的修复说明", "确认问题确实存在，避免仓促否认。", [-1, 3, 3, 2, 1, -2]], ["补录取舍", "补录可能涉及演员、导演、工程和字幕同步，不只是重新读一句。", "将 18 条按剧情影响与录音依赖分组", "先录必须项，其他内容待补丁评估。", [-2, 3, 4, 1, 2, -1]], ["交付韧性", "关键任务需要备份人员、共享资产和明确交接。失联不一定是失职。", "确认人员安全与交付状态，同时启动备援译员", "备援开始工作，但接手仍需要上下文。", [-3, 3, 4, 0, 3, -1]], ["发布范围", "固定发售日不等于所有任务都必须同时完成。分阶段交付需客户与开发共同确认。", "提出首发必修清单和补丁计划", "核心问题得到优先处理，非关键项有明确负责人。", [-1, 4, 6, 0, 2, -2]], ["术语复核", "全局替换可能误改角色名、复合词和特殊语境。检索后应复核命中项。", "按词边界检索，再由译员复核例外", "自动化减少工作量，同时保留语境判断。", [-2, 5, 4, 0, 2, -1]], ["验收测试", "RC 是候选发布构建。最后一轮测试应覆盖改动项、关键路径和已知高风险问题。", "检查改动清单并安排针对性回归测试", "验证近期修复，未覆盖内容明确记录。", [-2, 5, 5, 1, 1, -1]], ["发布签核", "签核应对应实际验收范围，不能把未验证内容描述为已经通过。", "签署已验证范围，请制作人确认剩余风险", "交付继续推进，但风险接受责任得到区分。", [0, 3, 5, 0, 2, -1]], ["供应商结算", "验收与支付应遵守合同；争议部分可单独处理，不必冻结所有无争议费用。", "先结算无争议工时，剩余提交变更审批", "译员收到部分款项，争议仍待解决。", [-2, 0, 3, 0, 5, -1]], ["项目复盘", "复盘应分析原因、影响、改进动作与责任人，而非只找替罪羊。", "组织跨职能复盘，确定三项可执行改进", "改进措施有负责人，但实施仍需要管理支持。", [0, 3, 3, 0, 3, -2]], ["职业路径", "语言专家、工程师、项目经理和制作人有不同能力要求，并非只有管理晋升一种路径。", "要求一次职业发展沟通，再决定下一步", "你明确了岗位期待和技能缺口。", [0, 0, 2, 1, 1, -1]]];

function chatMarkup(e,day,branch,record=null,preview=''){const name=e.from.split(' / ')[0],p=people[name]||[name.slice(0,1),'联系人','#a9b5b0'];const msgs=voices[e.title]||[e.quote];const attachment=['看起来很正确','被改写的报价','数据留存通知','声音的所有权','一个人的部门','试点报告','效率革命'].includes(e.title);const outgoingText=record?.outgoing||'';return `<div class="chathead" style="--person:${p[2]}"><div class="avatar">${esc(p[0])}</div><div><h2>${esc(name)}</h2><small>${esc(p[1])} · ${esc(branch||'私人消息')}</small></div></div><div class="chatbody" style="--person:${p[2]}"><div class="chatcontext">DAY ${day} / ${esc(e.title)}<br>${esc(e.body)}</div>${e.context?'<div class="continuity"><b>此前的决定</b>'+esc(e.context)+'</div>':''}${msgs.map((m,i)=>`<small>${i===0?esc(name)+' · 今日消息':''}</small><div class="bubble">${esc(m)}</div>`).join('')}${attachment?'<div class="attachment">附件 / 项目记录<br>'+esc(e.quote)+'</div>':''}${record?(outgoingText&&!outgoingText.startsWith('（')?'<div class="mine-label"><small>我 · 已发送</small></div><div class="bubble mine">'+esc(outgoingText)+'</div>':'<div class="action">'+esc(outgoingText||record.choice)+'</div>')+'<div class="chatresult">处理结果：'+esc(record.reply)+'</div>':''}${preview?'<div class="action">'+esc(preview)+'</div>':''}</div>`}
